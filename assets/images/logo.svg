<?xml version="1.0" encoding="UTF-8"?>
<!-- Utsaw Surya logo recreated as SVG -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240">
  <rect width="100%" height="100%" fill="#FBF7F0" />
  <g transform="translate(40,20)">
    <!-- sun circle -->
    <circle cx="80" cy="80" r="56" fill="#8B1919" stroke="#CBA135" stroke-width="6" />
    <!-- flame -->
    <path d="M80 54 C92 72, 74 84, 80 108 C86 84, 68 72, 80 54 Z" fill="#D4A23A" />
    <!-- rays -->
    <g fill="#CBA135">
      <rect x="76" y="-8" width="8" height="18" transform="rotate(0 80 0)" />
      <rect x="76" y="148" width="8" height="18" transform="rotate(180 80 148)" />
      <rect x="-8" y="76" width="18" height="8" transform="rotate(270 0 80)" />
      <rect x="148" y="76" width="18" height="8" transform="rotate(90 148 80)" />
    </g>
  </g>
  <g transform="translate(180,40)" font-family="Playfair Display, serif">
    <text x="0" y="38" font-size="56" fill="#7A1121">UTSAW</text>
    <text x="0" y="104" font-size="56" fill="#7A1121">SURYA</text>
  </g>
</svg>
